<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCatálogo - Filmes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo" onclick="loadHome()">🎬 CineCatálogo</div>
                
                <form class="search-form" onsubmit="handleSearch(event)">
                    <input type="text" class="search-input" placeholder="Buscar filmes..." id="searchInput">
                    <button type="submit" style="display:none;">Buscar</button>
                </form>
                
                <nav class="genres-nav" id="genresNav">
                    <!-- Gêneros carregados via JS -->
                </nav>
                
                <div class="header-actions">
                    <button class="btn-favorites" onclick="openFavorites()" title="Meus Favoritos">
                        ❤️ <span id="fav-count">0</span>
                    </button>
                    <div class="user-menu" id="userMenu">
                        <button class="btn-login" onclick="openAuthModal()">👤 Entrar</button>
                        <div class="user-dropdown" id="userDropdown">
                            <div class="dropdown-header">
                                <span class="user-avatar" id="userAvatar">U</span>
                                <div class="user-info">
                                    <span class="user-name" id="userName">Usuário</span>
                                    <span class="user-email" id="userEmail">email@exemplo.com</span>
                                </div>
                            </div>
                            <a href="#" onclick="openFavorites(); toggleUserDropdown()">❤️ Meus Favoritos</a>
                            <a href="#" onclick="openProfile(); toggleUserDropdown()">⚙️ Meu Perfil</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" onclick="logout(); toggleUserDropdown()" class="logout">🚪 Sair</a>
                        </div>
                    </div>
                </div>
                
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
            </div>
            
            <div class="mobile-menu" id="mobileMenu">
                <div id="mobileGenres">
                    <!-- Gêneros mobile carregados via JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        <div id="mainContent">
            <div class="loading">Carregando...</div>
        </div>
    </main>

    <!-- Modal de Detalhes do Filme -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-body" id="modalBody">
                <!-- Detalhes carregados via JS -->
            </div>
        </div>
    </div>

    <!-- Modal de Login/Cadastro -->
    <div class="modal" id="authModal">
        <div class="modal-content auth-modal">
            <button class="modal-close" onclick="closeAuthModal()">✕</button>
            
            <!-- Login Form -->
            <div id="loginForm">
                <h2 class="auth-title">🔐 Fazer Login</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginPass" placeholder="Sua senha">
                </div>
                <button class="btn-primary" onclick="doLogin()">Entrar</button>
                <p class="auth-toggle">
                    Não tem conta? <a href="#" onclick="toggleAuthForm('register')">Cadastre-se</a>
                </p>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="hidden">
                <h2 class="auth-title">📝 Criar Conta</h2>
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="regName" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="regPass" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="regConfirmPass" placeholder="Repita a senha">
                </div>
                <button class="btn-primary" onclick="doRegister()">Cadastrar</button>
                <p class="auth-toggle">
                    Já tem conta? <a href="#" onclick="toggleAuthForm('login')">Fazer Login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Modal de Perfil -->
    <div class="modal" id="profileModal">
        <div class="modal-content auth-modal">
            <button class="modal-close" onclick="closeProfile()">✕</button>
            <h2 class="auth-title">👤 Meu Perfil</h2>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="profileName">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="profileEmail" disabled>
            </div>
            <div class="form-group">
                <label>Favoritos Salvos</label>
                <input type="text" id="profileFavorites" disabled>
            </div>
            <div id="profileMessage" class="form-message"></div>
            <button class="btn-primary" onclick="updateProfile()">Salvar Alterações</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>🎬 CineCatálogo © <span id="year"></span> | Dados: TMDB</p>
        </div>
    </footer>

    <!-- Notificação Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
